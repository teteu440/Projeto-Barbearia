<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }} - Barbearia</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #1c1c1c;
            color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #262626;
            border-radius: 10px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 5px;
            color: #d4af37;
        }
        p.subtitle {
            text-align: center;
            color: #a0a0a0;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 0.9rem;
        }
        nav.tabs {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
        }
        nav.tabs a {
            color: #cccccc;
            text-decoration: none;
            font-size: 0.85rem;
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid #444;
        }
        nav.tabs a.active {
            background-color: #d4af37;
            color: #1c1c1c;
            border-color: #d4af37;
            font-weight: bold;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: #cccccc;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 18px;
            border: 1px solid #444;
            border-radius: 6px;
            background-color: #333;
            color: #f2f2f2;
            font-size: 1rem;
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #d4af37;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #d4af37;
            color: #1c1c1c;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        button:hover {
            background-color: #c19a2e;
        }
        .messages {
            list-style: none;
            padding: 0;
            margin: 0 0 18px 0;
        }
        .messages li {
            background-color: #2f5d3a;
            color: #d7f5df;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        .errorlist {
            list-style: none;
            padding: 0;
            margin: -12px 0 12px 0;
            color: #ff8080;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>{{ titulo }}</h1>
        <p class="subtitle">Preencha os dados abaixo</p>

        <nav class="tabs">
            <a href="{% url 'cadastro_cliente' %}" class="{% if titulo == 'Cadastro de Cliente' %}active{% endif %}">Cliente</a>
            <a href="{% url 'cadastro_barbeiro' %}" class="{% if titulo == 'Cadastro de Barbeiro' %}active{% endif %}">Barbeiro</a>
            <a href="{% url 'cadastro_servico' %}" class="{% if titulo == 'Cadastro de Serviço' %}active{% endif %}">Serviço</a>
        </nav>

        {% if messages %}
        <ul class="messages">
            {% for message in messages %}
            <li>{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}

        <form method="post" novalidate>
            {% csrf_token %}

            {% for field in form %}
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {{ field.errors }}
            {% endfor %}

            <button type="submit">Cadastrar</button>
        </form>
    </div>
</body>
</html>
