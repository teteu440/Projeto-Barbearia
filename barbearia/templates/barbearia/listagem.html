<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }} - Barbearia</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #1c1c1c;
            color: #f2f2f2;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #262626;
            border-radius: 10px;
            padding: 30px 35px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #d4af37;
        }
        nav.tabs {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        nav.tabs a {
            color: #cccccc;
            text-decoration: none;
            font-size: 0.85rem;
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid #444;
        }
        nav.tabs a.active {
            background-color: #d4af37;
            color: #1c1c1c;
            border-color: #d4af37;
            font-weight: bold;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 10px 12px;
            border-bottom: 1px solid #3a3a3a;
            font-size: 0.9rem;
        }
        th {
            color: #d4af37;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        tr:last-child td {
            border-bottom: none;
        }
        .empty {
            text-align: center;
            color: #999;
            padding: 30px 0;
            font-size: 0.9rem;
        }
        .voltar {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #d4af37;
            text-decoration: none;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ titulo }}</h1>

        <nav class="tabs">
            <a href="{% url 'listar_clientes' %}" class="{% if aba_ativa == 'clientes' %}active{% endif %}">Clientes</a>
            <a href="{% url 'listar_barbeiros' %}" class="{% if aba_ativa == 'barbeiros' %}active{% endif %}">Barbeiros</a>
            <a href="{% url 'listar_servicos' %}" class="{% if aba_ativa == 'servicos' %}active{% endif %}">Serviços</a>
        </nav>

        {% if linhas %}
        <table>
            <thead>
                <tr>
                    {% for coluna in colunas %}
                    <th>{{ coluna }}</th>
                    {% endfor %}
                </tr>
            </thead>
            <tbody>
                {% for linha in linhas %}
                <tr>
                    {% for valor in linha %}
                    <td>{{ valor }}</td>
                    {% endfor %}
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
        <p class="empty">Nenhum registro cadastrado ainda.</p>
        {% endif %}

        <a class="voltar" href="{% url 'cadastro_cliente' %}">← Voltar para os cadastros</a>
    </div>
</body>
</html>
